server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ТЗ §1.3/1.4.2: бандл должен встраиваться в <iframe> на доменах партнёрских автошкол (Фаза 2).
    # Реестр партнёрских доменов ещё не существует, поэтому пока разрешаем встраивание с любого
    # origin явно, а не оставляем как "случайно не заблокировано" по умолчанию — заменить на
    # allowlist конкретных доменов, когда появится реестр школ.
    add_header Content-Security-Policy "frame-ancestors *" always;

    # Vue Router в history-режиме (createWebHistory) — любой не-файловый путь отдаём
    # в index.html, иначе прямой заход/обновление страницы на "/topics" даст 404 от Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # "api" — имя сервиса backend в pdd-backend/docker-compose.yml; Docker резолвит его
    # в IP контейнера внутри общей сети pdd-network (см. шаг 1 инструкции).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
